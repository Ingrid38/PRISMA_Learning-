services:
  - type: web
    name: prisma-dua
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 100 --graceful-timeout 20 --workers 1 app:app
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
